short_bio: >-
  <p>
    I study how neural networks learn and scale, with the goal of making AI aligned and safe.
    I am a PhD researcher at the
    <a href="https://www.icp.uni-stuttgart.de/" target="_blank">University of Stuttgart</a>,
    connecting learning theory with measurements of training dynamics.
  </p>
  <p>
    My work includes
    <a href="https://proceedings.mlr.press/v306/nikolaou26a.html" target="_blank"><em>Spectral Reach</em></a>
    (ICML 2026) and tools for spectral analysis across multiple GPUs. At the
    <a href="https://institute-tue.ellis.eu/" target="_blank">ELLIS Institute Tübingen</a>,
    I worked on data curation and supervised fine-tuning for
    <a href="https://openeurollm.eu/" target="_blank">OpenEuroLLM</a>.
  </p>
  <p>
    I want to apply this background to alignment and monitoring: how post-training shapes
    behavior, and how we detect when models go off track. I am particularly interested in
    connecting mechanistic interpretability with learning theory to understand when internal
    signals improve monitoring.
  </p>

