short_bio: >-
  <p>
    I am a doctoral researcher at the
    <a href="https://www.icp.uni-stuttgart.de/" target="_blank">Institute for Computational Physics</a>
    at the University of Stuttgart, working at the intersection of theoretical physics and machine learning.
    I am affiliated with
    <a href="https://imprs.is.mpg.de/" target="_blank">IMPRS-IS</a> and the
    <a href="https://www.simtech.uni-stuttgart.de/" target="_blank">SimTech Graduate School</a>.
  </p>
  <p>
    In spring 2025 I was a visiting doctoral student at the
    <a href="https://www.cam.ac.uk/" target="_blank">University of Cambridge</a>
    (<a href="https://www.damtp.cam.ac.uk/" target="_blank">Department of Applied Mathematics and Theoretical Physics</a>).
    In spring 2026 I was a research intern at the
    <a href="https://institute-tue.ellis.eu/" target="_blank">ELLIS Institute Tübingen</a>,
    working on the <a href="https://openeurollm.eu/" target="_blank">OpenEuroLLM</a> project.
  </p>
  <h5 class="mt-3">Research Interests</h5>
  <p>
    I want to understand what the best possible form of learning is.
  </p>
  <p>
    Despite a lot of progress, we don't have a full theory of learning yet.
    I suspect the reason is that we lack empirical measures that scale to the regimes where things become interesting.
    You can only theorize what you can observe. So I think the empirical and theoretical sides have to grow together.
  </p>
  <p>
    That's why my research touches both sides: empirical measures of training
    (collective variables, scaling behaviour, internal dynamics) and the theory that ties them together.
  </p>

